<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDN — Suivi des 367 Items</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f9fc;
    --surface: #ffffff;
    --surface2: #f1f4f9;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent2: #7c3aed;
    --green: #059669;
    --yellow: #d97706;
    --red: #dc2626;
    --text: #1e293b;
    --muted: #94a3b8;
    --subtle: #64748b;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #f8f9fc 0%, #eef2ff 50%, #f8f9fc 100%);
    border-bottom: 1px solid var(--border);
    padding: 2rem 2.5rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .title-block h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .title-block h1 span {
    color: var(--accent);
  }

  .title-block p {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 0.25rem;
    font-family: 'DM Mono', monospace;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 1.5rem;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }

  .stat-chip {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-family: 'DM Mono', monospace;
    border: 1px solid;
    font-weight: 500;
  }

  .stat-chip.total { border-color: var(--border); background: var(--surface); color: var(--subtle); }
  .stat-chip.done { border-color: #6ee7b7; background: #ecfdf5; color: var(--green); }
  .stat-chip.inprog { border-color: #fcd34d; background: #fffbeb; color: var(--yellow); }
  .stat-chip.todo { border-color: #c4b5fd; background: #f5f3ff; color: var(--accent2); }

  .stat-chip .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .done .dot { background: var(--green); }
  .inprog .dot { background: var(--yellow); }
  .todo .dot { background: var(--accent2); }
  .total .dot { background: var(--muted); }

  /* PROGRESS BAR */
  .progress-wrap {
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .progress-bar-outer {
    flex: 1;
    height: 6px;
    background: var(--surface2);
    border-radius: 999px;
    overflow: hidden;
    max-width: 500px;
  }

  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 999px;
    transition: width 0.5s ease;
  }

  .progress-pct {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--subtle);
    white-space: nowrap;
  }

  /* CONTROLS */
  .controls {
    padding: 1rem 2.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 400px;
  }

  .search-wrap svg {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.75rem 0.5rem 2.25rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  .filter-group {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 0.4rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--subtle);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-btn.active-green { background: var(--green); border-color: var(--green); color: #022c22; }
  .filter-btn.active-yellow { background: var(--yellow); border-color: var(--yellow); color: #1c0a00; }
  .filter-btn.active-purple { background: var(--accent2); border-color: var(--accent2); color: #0f0d20; }

  .reset-btn {
    padding: 0.4rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--red);
    background: transparent;
    color: var(--red);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: auto;
  }

  .reset-btn:hover { background: var(--red); color: #fff; }

  /* ITEM LIST */
  main {
    padding: 1.5rem 2.5rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .results-info {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 1rem;
  }

  .items-grid {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    transition: all 0.15s;
    cursor: default;
    position: relative;
  }

  .item-card:hover {
    border-color: #3a4060;
    background: #1a1e2a;
  }

  .item-card.status-maitrise {
    border-left: 3px solid var(--green);
  }

  .item-card.status-en-cours {
    border-left: 3px solid var(--yellow);
  }

  .item-card.status-non-fait {
    border-left: 3px solid transparent;
  }

  .item-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    min-width: 32px;
    padding-top: 2px;
    user-select: none;
  }

  .item-name {
    flex: 1;
    font-size: 0.875rem;
    line-height: 1.5;
    color: var(--text);
  }

  .item-card.status-maitrise .item-name {
    color: var(--subtle);
    text-decoration: line-through;
    text-decoration-color: #065f46;
  }

  /* STATUS BUTTONS */
  .status-buttons {
    display: flex;
    gap: 0.3rem;
    flex-shrink: 0;
    align-items: center;
  }

  .status-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    transition: all 0.12s;
    flex-shrink: 0;
  }

  .status-btn:hover { transform: scale(1.1); }

  .status-btn.btn-maitrise { border-color: #065f46; background: #022c22; color: var(--green); }
  .status-btn.btn-maitrise:hover, .status-btn.btn-maitrise.active { background: var(--green); color: #022c22; border-color: var(--green); }

  .status-btn.btn-encours { border-color: #78350f; background: #1c0a00; color: var(--yellow); }
  .status-btn.btn-encours:hover, .status-btn.btn-encours.active { background: var(--yellow); color: #1c0a00; border-color: var(--yellow); }

  .status-btn.btn-reset { border-color: #374151; background: transparent; color: var(--muted); }
  .status-btn.btn-reset:hover { background: #374151; color: var(--text); }

  /* NOTE */
  .note-toggle {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--muted);
    transition: all 0.12s;
    flex-shrink: 0;
  }

  .note-toggle:hover { border-color: var(--accent2); color: var(--accent2); }
  .note-toggle.has-note { border-color: var(--accent2); color: var(--accent2); background: #1e1b4b; }

  .note-area {
    display: none;
    margin-top: 0.6rem;
    padding-left: calc(32px + 1rem);
  }

  .note-area.open { display: block; }

  .note-area textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    resize: vertical;
    min-height: 60px;
    outline: none;
    transition: border-color 0.2s;
  }

  .note-area textarea:focus { border-color: var(--accent2); }
  .note-area textarea::placeholder { color: var(--muted); }

  /* DATE badge */
  .date-badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    padding-top: 6px;
    min-width: 55px;
    text-align: right;
    flex-shrink: 0;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .empty svg { margin-bottom: 1rem; opacity: 0.3; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1.25rem;
    font-size: 0.82rem;
    color: var(--subtle);
    font-family: 'DM Mono', monospace;
    z-index: 999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Export btn */
  .export-btn {
    padding: 0.4rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--subtle);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .export-btn:hover { border-color: var(--green); color: var(--green); }

  @media (max-width: 600px) {
    header, .controls, main { padding-left: 1rem; padding-right: 1rem; }
    .title-block h1 { font-size: 1.4rem; }
    .stats-bar { gap: 0.5rem; }
    .stat-chip { font-size: 0.72rem; padding: 0.3rem 0.7rem; }
  }
</style>
</head>

<main>

    </svg>
    <p>Aucun item trouvé.</p>
  </div>
</main>

illance d'un malade sous plâtre/résine, diagnostiquer une complication"}, {"id": 366, "nom": "Exposition accidentelle aux liquides biologiques : conduite à tenir"}, {"id": 367, "nom": "Impact de l’environnement sur la santé."}];

const STORAGE_KEY = 'edn_revisions_v2';

// Load state
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { showToast('Erreur de sauvegarde'); }
}

let state = loadState();
let currentFilter = 'all';
let searchQuery = '';

function getItemState(id) {
  return state[id] || { status: 'non-fait', note: '', date: null };
}

function setItemStatus(id, status) {
  const prev = getItemState(id);
  if (prev.status === status) {
    // Toggle off
    state[id] = { ...prev, status: 'non-fait', date: null };
  } else {
    state[id] = { ...prev, status, date: status !== 'non-fait' ? new Date().toLocaleDateString('fr-FR') : null };
  }
  saveState();
  updateStats();
  updateCard(id);
}

function setItemNote(id, note) {
  const prev = getItemState(id);
  state[id] = { ...prev, note };
  saveState();
  // Update note toggle icon
  const card = document.querySelector(`.item-card[data-id="${id}"]`);
  if (card) {
    const toggle = card.querySelector('.note-toggle');
    if (note.trim()) toggle.classList.add('has-note');
    else toggle.classList.remove('has-note');
  }
}

function updateCard(id) {
  const card = document.querySelector(`.item-card[data-id="${id}"]`);
  if (!card) return;
  const s = getItemState(id);
  card.className = `item-card status-${s.status}`;

  // Update buttons
  card.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
  if (s.status === 'maitrise') card.querySelector('.btn-maitrise').classList.add('active');
  if (s.status === 'en-cours') card.querySelector('.btn-encours').classList.add('active');

  // Update date
  const dateEl = card.querySelector('.date-badge');
  if (dateEl) dateEl.textContent = s.date || '';

  // Re-check visibility
  const visible = isVisible(id, s);
  card.style.display = visible ? 'flex' : 'none';
}

function isVisible(id, s) {
  const item = ITEMS.find(i => i.id === id);
  if (!item) return false;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    if (!item.nom.toLowerCase().includes(q) && !String(item.id).includes(q)) return false;
  }
  if (currentFilter === 'all') return true;
  return s.status === currentFilter;
}

function updateStats() {
  let done = 0, inprog = 0;
  ITEMS.forEach(item => {
    const s = getItemState(item.id);
    if (s.status === 'maitrise') done++;
    else if (s.status === 'en-cours') inprog++;
  });
  const total = ITEMS.length;
  const todo = total - done - inprog;
  const pct = Math.round((done / total) * 100);

  document.getElementById('stat-total').textContent = `${total} items`;
  document.getElementById('stat-done').textContent = `${done} maîtrisé${done > 1 ? 's' : ''}`;
  document.getElementById('stat-inprog').textContent = `${inprog} en cours`;
  document.getElementById('stat-todo').textContent = `${todo} à faire`;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = `${pct} % maîtrisés`;
}

function renderAll() {
  const grid = document.getElementById('items-grid');
  grid.innerHTML = '';
  let count = 0;

  ITEMS.forEach(item => {
    const s = getItemState(item.id);
    const visible = isVisible(item.id, s);

    const card = document.createElement('div');
    card.className = `item-card status-${s.status}`;
    card.dataset.id = item.id;
    card.style.display = visible ? 'flex' : 'none';
    card.style.flexDirection = 'column';

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:flex-start;gap:1rem;width:100%';

    const hasNote = s.note && s.note.trim();

    row.innerHTML = `
      <span class="item-num">#${item.id}</span>
      <span class="item-name">${escapeHtml(item.nom)}</span>
      <span class="date-badge">${s.date || ''}</span>
      <div class="status-buttons">
        <button class="status-btn btn-maitrise ${s.status === 'maitrise' ? 'active' : ''}" 
          title="Maîtrisé" onclick="setItemStatus(${item.id}, 'maitrise')">✓</button>
        <button class="status-btn btn-encours ${s.status === 'en-cours' ? 'active' : ''}" 
          title="En cours" onclick="setItemStatus(${item.id}, 'en-cours')">~</button>
        <button class="note-toggle ${hasNote ? 'has-note' : ''}" 
          title="Ajouter une note" onclick="toggleNote(${item.id}, this)">✎</button>
      </div>
    `;

    const noteArea = document.createElement('div');
    noteArea.className = 'note-area';
    noteArea.id = `note-area-${item.id}`;
    noteArea.innerHTML = `<textarea placeholder="Notes, ressources, difficultés…" 
      onchange="setItemNote(${item.id}, this.value)"
      oninput="setItemNote(${item.id}, this.value)">${escapeHtml(s.note || '')}</textarea>`;

    card.appendChild(row);
    card.appendChild(noteArea);
    grid.appendChild(card);

    if (visible) count++;
  });

  document.getElementById('results-info').textContent =
    `Affichage de ${count} item${count > 1 ? 's' : ''} sur ${ITEMS.length}`;
  document.getElementById('empty-state').style.display = count === 0 ? 'block' : 'none';
}

function toggleNote(id, btn) {
  const area = document.getElementById(`note-area-${id}`);
  if (area.classList.contains('open')) {
    area.classList.remove('open');
  } else {
    area.classList.add('open');
    area.querySelector('textarea').focus();
  }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active', 'active-green', 'active-yellow', 'active-purple');
  });
  if (filter === 'all') btn.classList.add('active');
  else if (filter === 'maitrise') btn.classList.add('active-green');
  else if (filter === 'en-cours') btn.classList.add('active-yellow');
  else if (filter === 'non-fait') btn.classList.add('active-purple');
  renderAll();
}

let searchTimeout;
document.getElementById('search').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = this.value.trim();
    renderAll();
  }, 150);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function confirmReset() {
  if (confirm('Réinitialiser toute la progression ? Cette action est irréversible.')) {
    state = {};
    saveState();
    updateStats();
    renderAll();
    showToast('Progression réinitialisée');
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `edn_progression_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Export téléchargé');
}

// Init
updateStats();
renderAll();
</script>
